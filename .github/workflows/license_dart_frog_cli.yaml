name: license_dart_frog_cli

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "packages/dart_frog_cli/pubspec.yaml"
      - ".github/workflows/license_dart_frog_cli.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/dart_frog_cli/pubspec.yaml"
      - ".github/workflows/license_dart_frog_cli.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v2
    with:
      working_directory: packages/dart_frog_cli
